name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'viewer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Only dependency is TypeScript; install it GLOBALLY so no node_modules/ is
      # created under viewer/ (which would otherwise be swept into the Pages
      # artifact). The build is a single `tsc` -> dist/viewer.js.
      - name: Build viewer
        working-directory: viewer
        run: |
          npm install -g typescript@5
          tsc -p tsconfig.json

      # Pages must be enabled once in repo Settings -> Pages -> Source: GitHub Actions.
      # (Auto-enablement via the workflow token is blocked: "Resource not accessible
      # by integration".) With Pages already enabled, this step just reads the site.
      - uses: actions/configure-pages@v5

      - name: Upload viewer as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer

      - id: deployment
        uses: actions/deploy-pages@v4
